<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>User Profile</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f2f2f2;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .card {
                background: #fff;
                padding: 24px;
                border-radius: 10px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
                text-align: center;
                width: 280px;
            }
            .card img {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                object-fit: cover;
                margin-bottom: 12px;
            }
            .card h2 {
                margin: 8px 0 4px;
            }
            .card p {
                color: #666;
                margin: 4px 0;
            }
            .card input {
                width: 90%;
                padding: 6px;
                margin: 4px 0;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
            }
            .card button {
                margin-top: 12px;
                padding: 6px 16px;
                border: none;
                border-radius: 4px;
                background: #4682b4;
                color: #fff;
                cursor: pointer;
            }
            .card button:hover {
                background: #3a6d99;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img src="/profile-picture" alt="Profile picture" />

            <!-- View mode -->
            <div id="view-mode">
                <h2 id="view-name">Name</h2>
                <p id="view-email">Email</p>
                <p id="view-university">University</p>
                <button onclick="toggleEdit(true)">Edit</button>
            </div>

            <!-- Edit mode -->
            <div id="edit-mode" style="display: none">
                <input id="input-name" type="text" placeholder="Name" />
                <input id="input-email" type="email" placeholder="Email" />
                <input
                    id="input-university"
                    type="text"
                    placeholder="University"
                />
                <br />
                <button onclick="saveProfile()">Save</button>
                <button onclick="toggleEdit(false)">Cancel</button>
            </div>
        </div>

        <script>
            // Load whatever is stored in Mongo when the page opens
            function loadProfile() {
                fetch("/get-profile")
                    .then(function (res) {
                        return res.json();
                    })
                    .then(function (data) {
                        document.getElementById("view-name").textContent =
                            data.name || "Name";
                        document.getElementById("view-email").textContent =
                            data.email || "Email";
                        document.getElementById("view-university").textContent =
                            data.university || "University";
                    });
            }

            function toggleEdit(isEditing) {
                if (isEditing) {
                    document.getElementById("input-name").value =
                        document.getElementById("view-name").textContent;
                    document.getElementById("input-email").value =
                        document.getElementById("view-email").textContent;
                    document.getElementById("input-university").value =
                        document.getElementById("view-university").textContent;
                }
                document.getElementById("view-mode").style.display = isEditing
                    ? "none"
                    : "block";
                document.getElementById("edit-mode").style.display = isEditing
                    ? "block"
                    : "none";
            }

            function saveProfile() {
                let userObj = {
                    name: document.getElementById("input-name").value,
                    email: document.getElementById("input-email").value,
                    university:
                        document.getElementById("input-university").value,
                };

                fetch("/update-profile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(userObj),
                }).then(function () {
                    loadProfile();
                    toggleEdit(false);
                });
            }

            loadProfile();
        </script>
    </body>
</html>
